[data-a="theme"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}

const T={de:{ti:"Verhaltens-Tracker",tA:"Tiere",tO:"Erfassen",tD:"Daten",tI:"Info",name:"Name",num:"Nummer",sp:"Tierart",add:"Tier anlegen",need:"Bitte Name oder Nummer eingeben (mindestens eins).",noA:"Lege zuerst Tiere an.",goA:"Zu Tiere",del:"Löschen",cdel:"Tier und alle zugehörigen Daten löschen?",rem:"Erinnerung",every:"alle",s:"Sekunden",m:"Minuten",start:"Start",stop:"Stopp",now:"Jetzt erfassen",rt:"Zeit zum Erfassen!",rtx:"Aktueller Zustand wird für alle Tiere mit Zeitstempel gespeichert.",ok:"Erfassen",later:"Schließen",size:"Größe",aA:"Angelegte Tiere",cnt:"Tiere / Ereignisse / Momentaufnahmen",recent:"Letzte Ereignisse",exp:"JSON exportieren",copy:"Kopieren",clr:"Alle Daten löschen",cclr:"Wirklich ALLE Daten löschen?",dl:"Datei wurde zum Speichern angeboten.",cp:"In Zwischenablage kopiert.",run:"läuft",emp:"Noch keine Daten.",
h_app_t:"So funktioniert’s",h_app:"<p><b>1. Tiere:</b> Lege unter „Tiere“ deine Tiere an (Name und/oder Nummer).</p><p><b>2. Erfassen:</b> Wähle ein Tier und tippe auf Verhaltensweisen. Mehrere gleichzeitig sind möglich; erneutes Tippen beendet das Verhalten.</p><p><b>3. Zeitstempel:</b> Start und Ende jedes Verhaltens werden mit Zeit gespeichert.</p><p><b>4. Erinnerung:</b> Optional meldet sich die App alle x Sekunden/Minuten.</p><p><b>5. Export:</b> Unter „Daten“ als JSON. Alles bleibt lokal in deinem Browser.</p>",
h_animals_t:"Tiere anlegen",h_animals:"<p>Mindestens Name <i>oder</i> Nummer ist nötig, beides ist möglich.</p><p>Beispiele: „Berta“, „DE 0123“, „17 · Hannah“.</p><p>Die Tierart bestimmt, welche artspezifischen Verhaltensweisen angeboten werden (z. B. Wühlen bei Schweinen, Wiederkäuen bei Rind und Schaf).</p>",
h_obs_t:"Verhalten erfassen",h_obs:"<p>Die Gruppen (Ebene A: z. B. Fressen, Ruhen, Sozial) ordnen die Buttons; die Buttons selbst sind konkrete Verhaltensweisen (Ebene B).</p><p>Mehrere Verhaltensweisen können gleichzeitig aktiv sein, z. B. <i>Stehen</i> + <i>Wiederkäuen</i>. Aktive Buttons sind grün und zeigen die Dauer.</p><p>Größe: XL = ein Button pro Bildschirm, L = zwei, M = drei, S = vier Spalten. Das ? an einem Button zeigt Beispiele.</p><p><span class=em>📷</span> QR wählt ein Tier per Kamera (QR-Code mit Nummer oder Name der Ohrmarke; Kamera-Berechtigung nötig).</p><p>☀︎ (oben) schaltet den Outdoor-Modus ein: schwarz/gelb, größere Tasten und Abstände – für Sonnenlicht und Handschuhe. Rückmeldungen gibt es auf mehreren Kanälen: Farbe, Text, Vibration (kurz = Start, doppelt = Ende) und Ansage für Screenreader. Im Tab „Erfassen“ bleibt der Bildschirm an.</p>",
h_rem_t:"Erinnerung",h_rem:"<p>Beispiel: alle <b>5 Minuten</b> oder alle <b>30 Sekunden</b>. Zum Zeitpunkt gibt es Ton und Vibration; du bestätigst, und der aktuelle Zustand aller Tiere wird als Momentaufnahme gespeichert.</p><p>Die Seite muss geöffnet und der Bildschirm an bleiben.</p>",
h_exp_t:"JSON-Export",h_exp:"<p>Enthält Tiere, Ereignisse (Start, Ende, Dauer in Sekunden), Momentaufnahmen und eine Verhaltens-Tabelle. Zeiten sind UTC (ISO 8601).</p><pre>{\n \"animals\":[{\"id\":\"a1\",\"name\":\"Berta\",\"number\":\"17\"}],\n \"events\":[{\"animalId\":\"a1\",\n  \"behavior\":\"ruminating\",\n  \"start\":\"2026-10-27T08:00:00Z\",\n  \"durationSec\":420}]\n}</pre>",
ex:"Beispiel",ca:"Hauptverhalten",tS:"Auswertung",tG:"Heatmap",hm_beh:"Verhalten",hm_t:"Zeitraster-Heatmap",hm_hint:"Zeitraum (x: Tag/Wochentag/Woche) × Tageszeit (y). Zelle antippen für Details.",hm_mode_day:"Jeder Tag",hm_mode_wd:"Wochentag (gemittelt)",hm_mode_week:"Kalenderwoche",hm_m_dom:"Häufigstes Verhalten",hm_m_share:"Anteil eines Verhaltens",hm_m_entropy:"Verhaltensvielfalt (Entropie)",hm_m_nbeh:"Anzahl Verhaltensweisen",hm_m_cov:"Erfasste Zeit (Abdeckung)",hm_dd_n:"Ereignisse",hm_dd_dur:"Erfasste Dauer",hm_export_png:"PNG exportieren",hm_export_csv:"Matrix als CSV",hm_export_json:"Rohdaten als JSON",hm_export_cell:"Zelle als CSV",hm_trim:"Randtage ausblenden",storagefull_t:"Speicher voll",storagefull:"Speicherlimit (ca. 15 MB IndexedDB) erreicht. Exportiere JSON und loesche alte Eintraege.",beamer:"Beamer-Ordner (.zip)",shared:"Geteilt.",nozip:"ZIP-Funktion nicht verfügbar.",zipreadme:"Kompilieren mit: latexmk -pdf main.tex\n(oder TeX Live/MiKTeX bzw. Overleaf: Ordner als ZIP hochladen)\nBenötigte Pakete: beamer, pgfplots, pgfplotstable, booktabs.",hm_load:"Heatmap-Bibliothek wird geladen …",hm_off:"Plotly konnte nicht geladen werden. Die Heatmap braucht einmalig eine Internetverbindung – oder die Datei plotly-cartesian.min.js neben der HTML-Datei.",hm_retry:"Erneut versuchen",h_heat_t:"Zeitraster-Heatmap",h_heat:"<p>x-Achse: Aggregationszeitraum (jeder Tag, Wochentag über alle Wochen gemittelt, oder Kalenderwoche). y-Achse: Tageszeit in wählbarer Auflösung (5/15/30/60 min).</p><p><b>Metriken:</b> „Häufigstes Verhalten“ färbt die Zelle nach dem Verhalten mit der längsten Dauer; „Anteil“ zeigt den Zeitanteil eines gewählten Verhaltens; „Entropie“ misst die Verhaltensvielfalt (0 = ein Verhalten dominiert, 1 = gleichverteilt unter den in der Zelle vorkommenden Verhaltensweisen); „Abdeckung“ zeigt, wie viel der Zelle überhaupt mit Daten gefüllt ist (wichtig zur Interpretation!).</p><p>Ein Klick auf eine Zelle zeigt die zugrunde liegenden Werte, Anteile je Verhalten und eine Liste der Einzelereignisse – antippen öffnet den Ereignis-Editor. Die Grafik ist per Doppelklick auf Beschriftungen editierbar (Plotly) und lässt sich als PNG, die Matrix als CSV und die vollständigen Zellinhalte als JSON exportieren.</p><p><b>Nenner:</b> Zellendauer × Anzahl der beitragenden Tier-Tage (Tier × Kalendertag). „Abdeckung“ zählt überlappende Verhaltensweisen nur einmal. Nicht erfasste Zeit ist von „Verhalten nicht gezeigt“ nicht zu unterscheiden.</p><p><b>Randtage / DST:</b> Der erste und letzte Beobachtungstag sind oft nur teilweise erfasst – „Randtage ausblenden“ entfernt sie aus der Heatmap. Bin-Grenzen folgen der Wanduhr (lokal); an Sommer-/Winterzeit-Tagen bleibt die doppelte bzw. fehlende Stunde eine bekannte Mehrdeutigkeit.</p><p class='mut'>Hinweis: Dies ist eine explorative Zusatzdarstellung, kein validiertes Protokoll – Nenner/Interpretation bei Veröffentlichung selbst dokumentieren.</p>",outd:"Outdoor-Modus (Schwarz/Gelb, große Tasten)",night:"Nachtmodus (Rotlicht)",theme_day:"Tagesmodus",lock_t:"Bildschirm gesperrt",theme_hold:"Zum Wechseln 3 Sekunden gedrückt halten",mtemp:"Temp. °C",mhousing:"Haltungssystem",mdaynote:"Tagesnotiz",mdaynote_ph:"Wetter, Störungen, Besonderheiten…",irr_t:"Interobserver (κ)",irr_need:"Mindestens zwei Beobachternamen in den Ereignis-Metadaten nötig (Session → Beobachter vor dem Erfassen setzen).",irr_hint:"1-s-Raster überlappender Intervalle je Tier; Cohen κ zwischen zwei Beobachtern.",irr_pair:"Paar",irr_none:"Keine überlappenden Doppelkodierungen gefunden.",codebook:"Codebook (JSON)",photo:"Foto",photo_ok:"Foto gespeichert",photo_big:"Foto zu groß (max. ~2,5 MB)",afilter:"Tier suchen…",gear_t:"Weitere Optionen",gear_hint:"Seltener genutzte Werkzeuge und optionale Zweit-Sicherung.",backup_t:"Optionale Zweit-Sicherung",backup_limits:"Kein Gerät muss eine SD-Karte haben. Wenn vorhanden, kann unter Chrome/Edge eine JSON-Datei auf SD/USB gewählt werden – das ist nur ein Backup, kein Live-Spiegel. Safari/Firefox unterstützen die Datei-API oft nicht (dann manuell JSON exportieren). Nach längerem Stillstand kann die Schreibrechte erneut nötig sein.",backup_now:"Jetzt spiegeln",backup_set:"Datei wählen (SD/USB, falls vorhanden)",backup_clr:"Zweit-Sicherung aus",backup_hint:"Optional und geräteabhängig. Ohne SD: normaler JSON-Export genügt.",backup_on:"Zweit-Sicherung aktiv",backup_off:"Zweit-Sicherung beendet",backup_active:"Sicherung",backup_ok:"Auf Zweitmedium geschrieben",backup_fail:"Zweit-Sicherung fehlgeschlagen",backup_noapi:"Datei-API nicht verfügbar. Bitte Chrome/Edge nutzen oder manuell JSON exportieren.",print:"PDF/Druckbericht",print_block:"Popup blockiert – bitte erlauben.",ics:"Erinnerungen (ICS)",nv:"Ausser Sicht",nv_h:"Nicht beobachtbar – zählt nicht zum Verhaltens-Nenner",lock_h:"2 Sekunden halten zum Entsperren.",lock_hold:"Halten zum Entsperren",lock_off:"Entsperrt",geo:"GPS",geo_set:"GPS setzen",geo_none:"Kein GPS-Punkt",geo_fail:"GPS nicht verfuegbar",note:"Notiz",note_ph:"z.B. humpelt, nach Tierarzt",hist:"Aenderungshistorie",sync_hint:"Mehrgeraete: JSON exportieren und auf dem zweiten Geraet mergen.",astart:"gestartet",aend:"beendet",asel:"ausgewählt",adesel:"abgewählt",bkw:"Keine automatische Sicherung – regelmäßig exportieren.",bkl:"Letzter Export",gtab:"Tabellen",gtitle:"Diagramme",gtb:"Zeitbudget",gtl:"Tagesverlauf",gbt:"Phasen",gtm:"Übergänge",gsy:"Synchronität",gherd:"Herdenmittel",gall:"Alle Tage",gan:"Tiere",gnod:"Keine Daten für diese Auswahl.",gneed2:"Synchronität braucht mindestens zwei Tiere im Herdenmittel.",gx:"Mittlere Phasendauer (min)",gy:"Phasen pro Tag",demo:"Demodaten laden (6 Kühe, 2 Tage)",demodel:"Demodaten entfernen",gd_tb:"Anteil der erfassten Zeit je Verhalten (Balken: Mittel, Linie: ±SD, Punkte: einzelne Tiere). Überlappende Verhaltensweisen können zusammen über 100 % ergeben.",gd_tl:"Minuten je Stunde im Tagesverlauf für das gewählte Verhalten (dicke Linie: Herdenmittel ±SD, graue Linien: Einzeltiere).",gd_bt:"Jeder Punkt ist ein Tier: mittlere Dauer einer Phase (x) und Phasen pro Tag (y). Raute = Herdenmittel, rot = gewähltes Tier, grau = ausgeschlossen.",gd_tm:"Wie oft folgte auf ein Verhalten (Zeile) ein anderes (Spalte)? Farbe = Anteil innerhalb der Zeile.",gd_sy:"Anteil der gerade erfassten Tiere, die das Verhalten zeigen, in 5-Minuten-Schritten.",h_gch_t:"Diagramme",h_gch:"<p><b>Zeitbudget:</b> Anteil der erfassten Zeit je Verhalten. Es gilt als grundlegender Indikator für Tierwohl und Gesundheit, weil es je nach Haltung, Management und Gesundheitszustand variiert (z. B. Novák et al. 2017 für Milchkühe).</p><p><b>Tagesverlauf:</b> Minuten je Stunde. Zeigt Rhythmen und Störungen, z. B. Liegen oder Fressen zu ungewohnten Zeiten oder durch Melk- und Fütterungszeiten.</p><p><b>Phasen:</b> Anzahl und mittlere Dauer einzelner Phasen eines Verhaltens. Viele kurze Liegephasen sagen mehr als die Gesamtdauer allein. Fressverhalten wird in der Literatur u. a. über Fresszeit, Mahlzeitdauer und -häufigkeit beschrieben (Llonch et al. 2018).</p><p><b>Übergänge:</b> Verhaltenssequenzen: Welches Verhalten folgt auf welches? Auffällige Muster liefern Hinweise, ihre Deutung braucht Kontext.</p><p><b>Synchronität:</b> Anteil der Tiere, die gleichzeitig dasselbe Verhalten zeigen. Herden synchronisieren Ruhen und Fressen häufig; starke Abweichungen können mit Management, Platzangebot oder Rangkonflikten zusammenhängen.</p><p><b>Wichtig:</b> Wiederkäuen und Liegezeit gelten als nützliche, aber miteinander verknüpfte Indikatoren. Ihre Belastbarkeit ist umstritten, und feste Grenzwerte für die Liegedauer sind schwer zu begründen (Tucker et al. 2021). Phasen-, Übergangs- und Synchronitätsanalysen sind gängige Methoden der Verhaltensforschung, hier ohne Einzelnachweis. Verstehe die Diagramme als Hinweise, nicht als Diagnose.</p><p><b>Herdenmittel und Ausschluss einzelner Tiere:</b> ✓ = im Mittel enthalten, ✕ = ausgeschlossen (antippen zum Umschalten). Gründe, ein Tier herauszunehmen:</p><ul><li>krank, lahm, verletzt oder in Behandlung – es verzerrt das Mittel (als Einzeltier trotzdem ansehen);</li><li>Brunst, Abkalben/Ablammen, anderes Laktations- oder Trächtigkeitsstadium;</li><li>anderes Alter, andere Gruppe, Bucht oder Stallbereich, also nicht dieselbe Haltungsumwelt;</li><li>neu eingegliedert oder isoliert (Rangordnung);</li><li>zu wenig erfasste Zeit – wenige Daten machen die Werte verrauscht;</li><li>Erfassungsfehler oder Testdaten (z. B. Demodaten);</li><li>Vergleich eines Tieres mit der Herde: nimm das Tier selbst aus dem Herdenmittel, damit der Vergleich nicht zirkulär wird.</li></ul><p>Tierarten werden nie gemischt: das Herdenmittel gilt immer für eine Tierart.</p>",mgi:"Daten von Kollegen zusammenführen (JSON)",mgc:"Aus Zwischenablage",mg:"Daten zusammenführen",mgA:"Neue Tiere",mgM:"vorhandenen zugeordnet",mgE:"Neue Ereignisse",mgS:"Neue Scans/Momentaufnahmen",mgO:"Neue Beobachtungen",mgB:"Neue eigene Verhaltensweisen",mgD:"Duplikate übersprungen",mgK:"nicht zuordenbar",mgOp:"ohne Ende abgeschlossen",mgno:"Nichts Neues in dieser Datei.",mggo:"Zusammenführen",h_mg_t:"Daten zusammenführen",h_mg:"<p>Importiere den <b>JSON-Export</b> eines Kollegen und führe ihn mit deinen Daten zusammen, z. B. wenn ihr im selben Versuch unterschiedliche Tiere beobachtet oder bei einer Urlaubsvertretung.</p><p>Tiere werden zugeordnet, wenn die ID oder (Nummer bzw. Name) und die Tierart übereinstimmen; alle anderen werden neu angelegt. Bereits vorhandene Ereignisse und Scans werden nicht doppelt übernommen, du kannst dieselbe Datei also mehrfach importieren. Noch laufende Verhaltensweisen in der Datei werden zum Exportzeitpunkt beendet. Eigene Verhaltensweisen des Kollegen werden ergänzt. Gleiche Nummern in verschiedenen Beständen würden zusammengelegt – prüfe deshalb die Vorschau.</p><p>Tipp: Tragt unter „Tiere“ → Sitzung euren Namen als <b>Beobachter</b> ein. Er wird bei jedem Ereignis mitgespeichert und bleibt nach dem Zusammenführen erkennbar.</p>",qr:"QR-Code scannen",qrno:"Kein Tier mit diesem Code gefunden",qrex:"Tier existiert bereits",qrerr:"Kamera nicht verfügbar. Prüfe die Kamera-Berechtigung oder gib das Tier manuell ein.",wel:"Tierwohl-Indikatoren",wd:"Dauer (min)",wn:"Anzahl",radd:"Indikator hinzufügen",h_wel_t:"Tierwohl-Indikatoren",h_wel:"<p>Voreinstellungen blenden im Ethogramm alle für das Thema nicht benötigten Verhaltensweisen aus (rückgängig mit „Alle anzeigen“ oder im Ethogramm-Editor) und legen passende Indikatoren an. Es sind pragmatische Auswahlen aus dem App-Ethogramm, keine validierten Tierwohl-Protokolle.</p><p>Die Tabelle zeigt je Tier und gewähltem Tag die Dauer (Minuten) bzw. die Anzahl der Ereignisse. Trage einen Schwellenwert (≥) ein, dann wird der Wert rot. Schwellenwerte sind nicht vorbelegt – lege sie nach Literatur oder Betriebsstandard fest. Die Werte gelten nur für die beobachtete Zeit.</p>",val:"Validierung",vlab:"Video / Beobachtungs-ID",vmin:"Videolänge (min)",vstart:"● Beobachtung starten",vstop:"■ Beobachtung beenden",vlist:"Beobachtungen",vratio:"Zeit/Video",vtaps:"Eingaben",prot:"Studienprotokoll-Vorlage (.md)",vb:"BORIS-CSV",vg:"Raster-CSV",h_val_t:"Validierung",h_val:"<p>Für den Vergleich mit BORIS: Trage Video-ID und Länge ein und starte die Beobachtung genau mit dem Videostart; beende sie am Videoende. Die App misst die Codierzeit, zählt die Eingaben (Start, Stopp, Scan) und berechnet Codierzeit ÷ Videolänge.</p><p><b>BORIS-CSV:</b> START/STOP-Ereignisse mit Zeit in Sekunden ab Beobachtungsstart (BORIS-ähnlich). <b>Raster-CSV:</b> Zustand pro Sekunde und Tier, geeignet für Cohens Kappa. Die Protokoll-Vorlage beschreibt Ablauf und Auswertung.</p>",proto:"# Validierungsstudie: Verhaltens-Tracker vs. BORIS\n\n## 1. Fragestellung\nStimmen mit der App erfasste Verhaltensdaten mit einem Referenzwerkzeug (BORIS) überein, und wie hoch ist der Zeitaufwand?\n\n## 2. Material\n- Videos: ___ Clips à ___ min; Tierart: ___; Tiere pro Clip: ___\n- Ethogramm (Version/Datum): ___ (Export aus der App anhängen)\n\n## 3. Beobachter\n- Anzahl: ___; Erfahrung: ___; vorab geschult: ja / nein\n\n## 4. Ablauf\n1. Jeder Beobachter codiert dieselben Clips in beiden Werkzeugen; Reihenfolge (App/BORIS) ausbalancieren, Pause zwischen den Durchgängen mindestens ___ Tage.\n2. App: Video-ID und Länge eintragen, „Beobachtung starten“ zum Videostart, „beenden“ am Videoende.\n3. BORIS: dieselben Clips codieren, Ereignisse als CSV exportieren.\n4. Danach Usability-Fragebogen (SUS, 10 Fragen).\n\n## 5. Auswertung\n- Übereinstimmung: Cohens Kappa auf dem 1-s-Raster (Raster-CSV), je Verhalten und gesamt\n- Dauer je Verhalten: ICC bzw. Bland-Altman\n- Zeitaufwand: Codierzeit ÷ Videolänge, Anzahl Eingaben\n- Usability: SUS-Score\n\n## 6. Datenablage und Ethik\n- Rohdaten (JSON/CSV) archivieren\n- Tierwohl-/Ethikvotum: ___\n",hscan:"Herdenscan",msingle:"Einzeltier",mherd:"Herde",hinfo:"Beim Herdenscan erfasst du für jedes Tier, was es im Moment des Scans tut (Scan-Sampling). Wähle pro Tier das Verhalten und tippe auf „Speichern & weiter“.",hok:"Speichern & weiter",hskip:"Überspringen",hend:"Scan beenden",hneed:"Bitte mindestens ein Verhalten wählen (oder „Überspringen“).",hsum:"Tiere je Verhalten",csv3:"CSV (Scans)",h_herd_t:"Herdenscan",h_herd:"<p><b>Scan-Sampling:</b> Du erfasst für jedes Tier, was es im Moment des Scans tut. Wähle ein oder mehrere Verhaltensweisen und tippe auf „Speichern & weiter“; „Überspringen“ nutzt du, wenn ein Tier nicht sichtbar ist. Alle Tiere eines Durchgangs teilen sich dieselbe Scan-ID und die Startzeit; jedes Tier bekommt zusätzlich seinen eigenen Zeitstempel. Mit ✓ markierte Tiere kannst du antippen und korrigieren.</p><p>Mit der Erinnerung kannst du in festen Abständen einen Scan starten. Die Auswertung zeigt je Scan den Anteil der Tiere pro Verhalten (Mehrfachnennungen möglich), der Export „CSV (Scans)“ enthält alle Scan-Daten.</p>",eth:"Ethogramm",sess:"Sitzung",mstudy:"Studie / Projekt",mobs:"Beobachter",mgrp:"Gruppe / Bucht",mplace:"Ort",ethx:"Ethogramm exportieren",ethi:"Ethogramm importieren",imp_ok:"Importierte Verhaltensweisen:",imp_bad:"Datei konnte nicht gelesen werden.",h_sess_t:"Sitzungsdaten",h_sess:"<p>Studie, Beobachter, Gruppe/Bucht und Ort werden bei jedem <b>neu gestarteten</b> Ereignis mitgespeichert und stehen in JSON- und CSV-Export. Eine spätere Änderung betrifft nur neue Ereignisse. Die Angabe „Studie“ dient im START/STOP-CSV als Observation-ID.</p>",bn:"Neues Verhalten",bd:"Definition / Beispiel",badd:"Verhalten hinzufügen",bneed:"Name und mindestens eine Tierart nötig.",inuse:"Verhalten wird in Daten verwendet – bitte ausblenden statt löschen.",undo:"↶ Rückgängig",edt:"Ereignis bearbeiten",tstart:"Start",tend:"Ende (leer = läuft noch)",save:"Speichern",bad:"Das Ende muss nach dem Start liegen.",dup:"Dieses Verhalten läuft bei dem Tier bereits.",csv1:"CSV (Ereignisse)",csv2:"CSV (START/STOP)",edh:"antippen zum Bearbeiten",h_eth_t:"Ethogramm-Editor",h_eth:"<p>● = Verhalten wird beim Erfassen angezeigt, ○ = ausgeblendet. Eigene Verhaltensweisen (mit Definition und Tierart) kannst du hinzufügen und, solange keine Daten dazu existieren, wieder löschen (×). Das Ethogramm wird mit Definitionen im JSON-Export mitgeliefert. Unter „Daten“ kannst du es als JSON exportieren und importieren (importiert werden nur neue Verhaltensweisen).</p><p><b>Rückgängig</b> (Tab „Erfassen“) macht den letzten Start oder Stopp rückgängig. Unter „Daten“ tippst du ein Ereignis an, um Verhalten, Start und Ende zu korrigieren oder es zu löschen.</p><p><b>CSV:</b> „Ereignisse“ = eine Zeile pro Ereignis; „START/STOP“ = eine Zeile pro Start bzw. Stopp (BORIS-ähnlich, Zeit in Sekunden ab dem ersten Ereignis). Trennzeichen Komma, UTF-8.</p>",by:"Auflösung",day:"Tag",hour:"Stunde",tot:"Σ Dauer",n:"Anz.",gantt:"Gantt-Diagramm",nog:"Keine Ereignisse an diesem Tag.",sm:"Dauer je Verhalten",h_st_t:"Auswertung",h_st:"<p>Wähle oben ein Tier. <b>Tag</b> zeigt die Dauer je Verhalten für jeden Tag, <b>Stunde</b> für jede Stunde des gewählten Datums. Dunklere Zellen = längere Dauer; „Anz.“ ist die Zahl der Ereignisse. Gleichzeitige Verhaltensweisen werden einzeln gezählt, die Summen können also die Beobachtungszeit übersteigen.</p><p>Das <b>Gantt-Diagramm</b> zeigt jedes Verhalten als Balken über der Uhrzeit für das gewählte Datum. Laufende Verhaltensweisen reichen bis „jetzt“. Ein langer Druck auf einen Balken zeigt Start und Ende.</p>",ab:"Über die App",abx:"Erfassung von Nutztierverhalten (Rind, Schwein, Schaf) mit 15 allgemeinen und artspezifischen Verhaltensweisen. Alle Daten werden ausschließlich lokal in deinem Browser (localStorage) gespeichert; es erfolgt keine Übertragung an Server. Wenn du Browserdaten löschst, gehen sie verloren – exportiere regelmäßig.",imp:"Impressum",impx:"Angaben gemäß § 5 DDG:<br>[Name / Firma ergänzen]<br>[Straße, PLZ Ort ergänzen]<br>[E-Mail ergänzen]",web:"Zur Website harbers-agrarinformatik.de"},
en:{ti:"Behavior Tracker",tA:"Animals",tO:"Record",tD:"Data",tI:"Info",name:"Name",num:"Number",sp:"Species",add:"Add animal",need:"Please enter a name or a number (at least one).",noA:"Add animals first.",goA:"Go to Animals",del:"Delete",cdel:"Delete animal and all its data?",rem:"Reminder",every:"every",s:"seconds",m:"minutes",start:"Start",stop:"Stop",now:"Record now",rt:"Time to record!",rtx:"The current state of all animals will be saved with a timestamp.",ok:"Record",later:"Close",size:"Size",aA:"Your animals",cnt:"Animals / events / snapshots",recent:"Recent events",exp:"Export JSON",copy:"Copy",clr:"Delete all data",cclr:"Really delete ALL data?",dl:"File offered for saving.",cp:"Copied to clipboard.",run:"running",emp:"No data yet.",
h_app_t:"How it works",h_app:"<p><b>1. Animals:</b> Add your animals under “Animals” (name and/or number).</p><p><b>2. Record:</b> Pick an animal and tap behaviors. Several at once are possible; tap again to end a behavior.</p><p><b>3. Timestamps:</b> Start and end of every behavior are saved with the time.</p><p><b>4. Reminder:</b> Optionally the app reminds you every x seconds/minutes.</p><p><b>5. Export:</b> Under “Data” as JSON. Everything stays local in your browser.</p>",
h_animals_t:"Adding animals",h_animals:"<p>At least a name <i>or</i> a number is required; both are fine.</p><p>Examples: “Berta”, “DE 0123”, “17 · Hannah”.</p><p>The species decides which species-specific behaviors are offered (e.g. rooting for pigs, ruminating for cattle and sheep).</p>",
h_obs_t:"Recording behavior",h_obs:"<p>Groups (level A: e.g. feeding, resting, social) organize the buttons; the buttons are specific behaviors (level B).</p><p>Several behaviors can be active at once, e.g. <i>Standing</i> + <i>Ruminating</i>. Active buttons are green and show the duration.</p><p>Size: XL = one button per screen, L = two, M = three, S = four columns. The ? on a button shows examples.</p><p><span class=em>📷</span> QR selects an animal by camera (QR code containing the ear-tag number or name; camera permission required).</p><p>☀︎ (top) switches on outdoor mode: black/yellow, larger buttons and spacing – for sunlight and gloves. Feedback uses several channels: color, text, vibration (short = start, double = end) and a screen-reader announcement. The screen stays on in the Record tab.</p>",
h_rem_t:"Reminder",h_rem:"<p>Example: every <b>5 minutes</b> or every <b>30 seconds</b>. When due you get a sound and vibration; confirm and the current state of all animals is saved as a snapshot.</p><p>The page must stay open with the screen on.</p>",
h_exp_t:"JSON export",h_exp:"<p>Contains animals, events (start, end, duration in seconds), snapshots and a behavior table. Times are UTC (ISO 8601).</p><pre>{\n \"animals\":[{\"id\":\"a1\",\"name\":\"Berta\",\"number\":\"17\"}],\n \"events\":[{\"animalId\":\"a1\",\n  \"behavior\":\"ruminating\",\n  \"start\":\"2026-10-27T08:00:00Z\",\n  \"durationSec\":420}]\n}</pre>",
ex:"Example",ca:"Main category",tS:"Analysis",tG:"Heatmap",hm_beh:"Behavior",hm_t:"Day/time heatmap",hm_hint:"Period (x: day/weekday/week) × time of day (y). Tap a cell for details.",hm_mode_day:"Each day",hm_mode_wd:"Weekday (averaged)",hm_mode_week:"Calendar week",hm_m_dom:"Dominant behavior",hm_m_share:"Share of one behavior",hm_m_entropy:"Behavioral diversity (entropy)",hm_m_nbeh:"Number of behaviors",hm_m_cov:"Recorded time (coverage)",hm_dd_n:"Events",hm_dd_dur:"Recorded duration",hm_export_png:"Export PNG",hm_export_csv:"Matrix as CSV",hm_export_json:"Raw data as JSON",hm_export_cell:"Cell as CSV",hm_trim:"Hide edge days",storagefull_t:"Storage full",storagefull:"Storage limit (~15 MB IndexedDB) reached. Export JSON and delete old entries.",beamer:"Beamer folder (.zip)",shared:"Shared.",nozip:"ZIP function not available.",zipreadme:"Compile with: latexmk -pdf main.tex\n(or TeX Live/MiKTeX / Overleaf: upload the ZIP)\nRequired packages: beamer, pgfplots, pgfplotstable, booktabs.",hm_load:"Loading heatmap library …",hm_off:"Plotly could not be loaded. The heatmap needs an internet connection once – or the file plotly-cartesian.min.js next to the HTML file.",hm_retry:"Try again",h_heat_t:"Day/time heatmap",h_heat:"<p>x-axis: aggregation period (each day, weekday averaged across weeks, or calendar week). y-axis: time of day at a chosen resolution (5/15/30/60 min).</p><p><b>Metrics:</b> “Dominant behavior” colors the cell by the longest-lasting behavior; “Share” shows the time share of a chosen behavior; “Entropy” measures behavioral diversity (0 = one behavior dominates, 1 = evenly spread among the behaviors present in the cell); “Coverage” shows how much of the cell actually has data (important for interpretation!).</p><p>Click a cell to see the underlying values, shares per behavior and a list of individual events – tap one to open the event editor. The chart is editable (double-click labels, Plotly) and can be exported as PNG, the matrix as CSV, and full cell contents as JSON.</p><p><b>Denominator:</b> cell duration × number of contributing animal-days (animal × calendar day). “Coverage” counts overlapping behaviors only once. Unrecorded time cannot be distinguished from “behavior not shown”.</p><p><b>Edge days / DST:</b> The first and last observation day are often only partially covered – “Hide edge days” removes them from the heatmap. Bin boundaries follow the wall clock (local); on DST transition days the duplicated or missing hour remains a known ambiguity.</p><p class='mut'>Note: this is an exploratory add-on visualization, not a validated protocol – document denominators/interpretation yourself for publication.</p>",outd:"Outdoor mode (black/yellow, large buttons)",night:"Night mode (red light)",theme_day:"Day mode",lock_t:"Screen locked",theme_hold:"Hold for 3 seconds to switch",mtemp:"Temp. °C",mhousing:"Housing system",mdaynote:"Day note",mdaynote_ph:"Weather, disturbances, notes…",irr_t:"Inter-observer (κ)",irr_need:"Need at least two observer names in event metadata (set Session → Observer before recording).",irr_hint:"1-s grid over overlapping intervals per animal; Cohen κ between two observers.",irr_pair:"Pair",irr_none:"No overlapping double-coding found.",codebook:"Codebook (JSON)",photo:"Photo",photo_ok:"Photo saved",photo_big:"Photo too large (max ~2.5 MB)",afilter:"Filter animals…",gear_t:"More options",gear_hint:"Less-used tools and optional secondary backup.",backup_t:"Optional secondary backup",backup_limits:"Not every device has an SD card. Where available, Chrome/Edge can write a JSON file to SD/USB – this is a backup only, not a live mirror. Safari/Firefox often lack the File System Access API (export JSON manually). After idle time, write permission may be requested again.",backup_now:"Mirror now",backup_set:"Choose file (SD/USB if available)",backup_clr:"Disable secondary backup",backup_hint:"Optional and device-dependent. Without SD: normal JSON export is enough.",backup_on:"Secondary backup on",backup_off:"Secondary backup off",backup_active:"Backup",backup_ok:"Written to secondary media",backup_fail:"Secondary backup failed",backup_noapi:"File API unavailable. Use Chrome/Edge or export JSON manually.",print:"PDF/print report",print_block:"Popup blocked – please allow.",ics:"Reminders (ICS)",nv:"Out of sight",nv_h:"Not observable – excluded from behaviour denominators",lock_h:"Hold 2 seconds to unlock.",lock_hold:"Hold to unlock",lock_off:"Unlocked",geo:"GPS",geo_set:"Set GPS",geo_none:"No GPS point",geo_fail:"GPS unavailable",note:"Note",note_ph:"e.g. limping, after vet",hist:"Change history",sync_hint:"Multi-device: export JSON and merge on the second device.",astart:"started",aend:"ended",asel:"selected",adesel:"deselected",bkw:"No automatic backup – export regularly.",bkl:"Last export",gtab:"Tables",gtitle:"Charts",gtb:"Time budget",gtl:"Daily pattern",gbt:"Bouts",gtm:"Transitions",gsy:"Synchrony",gherd:"Herd mean",gall:"All days",gan:"animals",gnod:"No data for this selection.",gneed2:"Synchrony needs at least two animals in the herd mean.",gx:"Mean bout duration (min)",gy:"Bouts per day",demo:"Load demo data (6 cows, 2 days)",demodel:"Remove demo data",gd_tb:"Share of observed time per behavior (bar: mean, line: ±SD, dots: individual animals). Overlapping behaviors can add up to more than 100 %.",gd_tl:"Minutes per hour over the day for the selected behavior (thick line: herd mean ±SD, grey lines: individual animals).",gd_bt:"Each dot is an animal: mean duration of a bout (x) and bouts per day (y). Diamond = herd mean, red = selected animal, grey = excluded.",gd_tm:"How often did one behavior (row) follow another (column)? Color = share within the row.",gd_sy:"Share of currently observed animals showing the behavior, in 5-minute steps.",h_gch_t:"Charts",h_gch:"<p><b>Time budget:</b> share of observed time per behavior. It is regarded as a basic indicator of welfare and health because it varies with housing, management and health status (e.g. Novák et al. 2017 for dairy cows).</p><p><b>Daily pattern:</b> minutes per hour. Shows rhythms and disturbances, e.g. lying or feeding at unusual times or driven by milking and feeding schedules.</p><p><b>Bouts:</b> number and mean duration of single bouts of a behavior. Many short lying bouts say more than total duration alone. Feeding behavior is described in the literature by feeding time, meal duration and meal frequency, among others (Llonch et al. 2018).</p><p><b>Transitions:</b> behavior sequences: which behavior follows which? Conspicuous patterns give hints; interpreting them needs context.</p><p><b>Synchrony:</b> share of animals showing the same behavior at the same time. Herds often synchronize resting and feeding; strong deviations may relate to management, space allowance or social conflicts.</p><p><b>Important:</b> rumination and lying time are useful but interrelated indicators. Their reliability is debated, and fixed thresholds for lying time are hard to justify (Tucker et al. 2021). Bout, transition and synchrony analyses are common methods in behavioral research, given here without individual references. Treat the charts as hints, not as a diagnosis.</p><p><b>Herd mean and excluding single animals:</b> ✓ = included in the mean, ✕ = excluded (tap to toggle). Reasons to take an animal out:</p><ul><li>sick, lame, injured or under treatment – it distorts the mean (still look at it as a single animal);</li><li>estrus, calving/lambing, different lactation or pregnancy stage;</li><li>different age, group, pen or barn area, i.e. not the same housing environment;</li><li>newly introduced or isolated (social rank);</li><li>too little observed time – few data make values noisy;</li><li>recording errors or test data (e.g. demo data);</li><li>comparing one animal with the herd: take that animal out of the herd mean so the comparison is not circular.</li></ul><p>Species are never mixed: the herd mean always refers to one species.</p>",mgi:"Merge colleagues’ data (JSON)",mgc:"From clipboard",mg:"Merge data",mgA:"New animals",mgM:"matched to existing",mgE:"New events",mgS:"New scans/snapshots",mgO:"New observations",mgB:"New custom behaviors",mgD:"duplicates skipped",mgK:"not assignable",mgOp:"closed without end",mgno:"Nothing new in this file.",mggo:"Merge",h_mg_t:"Merging data",h_mg:"<p>Import a colleague’s <b>JSON export</b> and merge it with your data, e.g. when you observe different animals in the same trial or for holiday cover.</p><p>Animals are matched when the ID or (number or name) and the species agree; all others are created. Existing events and scans are not imported twice, so you can import the same file repeatedly. Behaviors still running in the file are closed at the export time. The colleague’s custom behaviors are added. Identical numbers in different herds would be merged – so check the preview.</p><p>Tip: enter your name as <b>observer</b> under Animals → Session. It is saved with every event and stays recognizable after merging.</p>",qr:"Scan QR code",qrno:"No animal found for this code",qrex:"Animal already exists",qrerr:"Camera not available. Check the camera permission or enter the animal manually.",wel:"Welfare indicators",wd:"Duration (min)",wn:"Count",radd:"Add indicator",h_wel_t:"Welfare indicators",h_wel:"<p>Presets hide all behaviors not needed for the topic in the ethogram (undo with “Show all” or in the ethogram editor) and create matching indicators. They are pragmatic selections from the app ethogram, not validated welfare protocols.</p><p>The table shows, per animal and selected day, the duration (minutes) or the number of events. Enter a threshold (≥) and the value turns red. Thresholds are not preset – set them from literature or farm standards. Values cover the observed time only.</p>",val:"Validation",vlab:"Video / observation ID",vmin:"Video length (min)",vstart:"● Start observation",vstop:"■ End observation",vlist:"Observations",vratio:"Time/video",vtaps:"inputs",prot:"Study protocol template (.md)",vb:"BORIS CSV",vg:"Grid CSV",h_val_t:"Validation",h_val:"<p>For the comparison with BORIS: enter video ID and length, start the observation exactly when the video starts and end it when the video ends. The app measures coding time, counts inputs (start, stop, scan) and computes coding time ÷ video length.</p><p><b>BORIS CSV:</b> START/STOP events with time in seconds from observation start (BORIS-like). <b>Grid CSV:</b> state per second and animal, suitable for Cohen’s kappa. The protocol template describes procedure and analysis.</p>",proto:"# Validation study: Behavior Tracker vs. BORIS\n\n## 1. Research question\nDo behavior data recorded with the app agree with a reference tool (BORIS), and how much time does coding take?\n\n## 2. Material\n- Videos: ___ clips of ___ min; species: ___; animals per clip: ___\n- Ethogram (version/date): ___ (attach export from the app)\n\n## 3. Observers\n- Number: ___; experience: ___; trained beforehand: yes / no\n\n## 4. Procedure\n1. Each observer codes the same clips in both tools; counterbalance the order (app/BORIS), with a break of at least ___ days between rounds.\n2. App: enter video ID and length, tap “Start observation” when the video starts and “End observation” when it ends.\n3. BORIS: code the same clips and export events as CSV.\n4. Afterwards a usability questionnaire (SUS, 10 items).\n\n## 5. Analysis\n- Agreement: Cohen’s kappa on the 1-s grid (grid CSV), per behavior and overall\n- Duration per behavior: ICC or Bland-Altman\n- Effort: coding time ÷ video length, number of inputs\n- Usability: SUS score\n\n## 6. Data storage and ethics\n- Archive raw data (JSON/CSV)\n- Animal welfare / ethics approval: ___\n",hscan:"Herd scan",msingle:"Single animal",mherd:"Herd",hinfo:"In a herd scan you record, for every animal, what it is doing at the moment of the scan (scan sampling). Pick the behavior per animal and tap “Save & next”.",hok:"Save & next",hskip:"Skip",hend:"End scan",hneed:"Please pick at least one behavior (or “Skip”).",hsum:"animals per behavior",csv3:"CSV (scans)",h_herd_t:"Herd scan",h_herd:"<p><b>Scan sampling:</b> For each animal you record what it is doing at the moment of the scan. Pick one or more behaviors and tap “Save & next”; use “Skip” if an animal is not visible. All animals of one pass share the same scan ID and start time; each animal also gets its own timestamp. You can tap animals marked ✓ to correct them.</p><p>The reminder can start a scan at fixed intervals. The analysis shows, per scan, the share of animals per behavior (multiple answers possible); the “CSV (scans)” export contains all scan data.</p>",eth:"Ethogram",sess:"Session",mstudy:"Study / project",mobs:"Observer",mgrp:"Group / pen",mplace:"Location",ethx:"Export ethogram",ethi:"Import ethogram",imp_ok:"Imported behaviors:",imp_bad:"File could not be read.",h_sess_t:"Session data",h_sess:"<p>Study, observer, group/pen and location are saved with every <b>newly started</b> event and appear in the JSON and CSV exports. Later changes affect new events only. The study name is used as observation ID in the START/STOP CSV.</p>",bn:"New behavior",bd:"Definition / example",badd:"Add behavior",bneed:"A name and at least one species are required.",inuse:"Behavior is used in data – please hide instead of deleting.",undo:"↶ Undo",edt:"Edit event",tstart:"Start",tend:"End (empty = still running)",save:"Save",bad:"The end must be after the start.",dup:"This behavior is already running for this animal.",csv1:"CSV (events)",csv2:"CSV (START/STOP)",edh:"tap to edit",h_eth_t:"Ethogram editor",h_eth:"<p>● = behavior is shown when recording, ○ = hidden. You can add your own behaviors (with definition and species) and delete them (×) as long as no data uses them. The ethogram, including definitions, is part of the JSON export. Under “Data” you can export and import it as JSON (only new behaviors are imported).</p><p><b>Undo</b> (Record tab) reverts the last start or stop. Under “Data”, tap an event to correct behavior, start and end, or to delete it.</p><p><b>CSV:</b> “events” = one row per event; “START/STOP” = one row per start or stop (BORIS-like, time in seconds from the first event). Comma-separated, UTF-8.</p>",by:"Resolution",day:"Day",hour:"Hour",tot:"Σ duration",n:"Count",gantt:"Gantt chart",nog:"No events on this day.",sm:"Duration per behavior",h_st_t:"Analysis",h_st:"<p>Pick an animal above. <b>Day</b> shows the duration per behavior for each day, <b>Hour</b> for each hour of the selected date. Darker cells = longer duration; “Count” is the number of events. Simultaneous behaviors are counted separately, so totals can exceed the observation time.</p><p>The <b>Gantt chart</b> shows every behavior as a bar over the time of day for the selected date. Running behaviors extend to “now”. Long-press a bar to see start and end.</p>",ab:"About",abx:"Recording livestock behavior (cattle, pigs, sheep) with 15 general and species-specific behaviors. All data is stored only locally in your browser (localStorage); nothing is sent to a server. Clearing browser data deletes it – export regularly.",imp:"Legal notice (Impressum)",impx:"Information pursuant to § 5 DDG:<br>[add name / company]<br>[add street, postal code, city]<br>[add e-mail]",web:"Visit harbers-agrarinformatik.de"}};
const D={animals:[],events:[],scans:[],lang:(navigator.language||"de").startsWith("de")?"de":"en",view:"A",cur:null,sz:"XL",rem:{val:5,unit:"m",on:false}};
let S=D;try{const x=JSON.parse(localStorage.getItem("vt1"));if(x&&x.animals)S=Object.assign({},D,x)}catch(e){}
const IDB_NAME="vt1-idb",IDB_STORE="state",SOFT_MB=15;
function openIDB(){return new Promise(function(res,rej){if(!window.indexedDB){rej(new Error("no idb"));return}var r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=function(){var db=r.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbSet(obj){return openIDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put(obj,"main");tx.oncomplete=function(){res(true)};tx.onerror=function(){rej(tx.error)}})})}
function idbGet(){return openIDB().then(function(db){return new Promise(function(res,rej){var q=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get("main");q.onsuccess=function(){res(q.result||null)};q.onerror=function(){rej(q.error)}})})}
function approxSize(){try{return new Blob([JSON.stringify(S)]).size}catch(e){return JSON.stringify(S).length}}

async function idbBackupHandle(op,handle){
  try{
    var db=await openIDB();
    return await new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readwrite');
      if(op==='set')tx.objectStore(IDB_STORE).put(handle,'backupHandle');
      else if(op==='get'){var q=tx.objectStore(IDB_STORE).get('backupHandle');q.onsuccess=function(){res(q.result||null)};q.onerror=function(){rej(q.error)};return}
      else if(op==='del')tx.objectStore(IDB_STORE).delete('backupHandle');
      tx.oncomplete=function(){res(true)};tx.onerror=function(){rej(tx.error)};
    });
  }catch(e){return null}
}
async function pickBackupFile(){
  if(!window.showSaveFilePicker){modal(t('backup_noapi'));return}
  try{
    var handle=await showSaveFilePicker({
      suggestedName:'verhaltens-tracker-backup.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}],
      excludeAcceptAllOption:false
    });
    await idbBackupHandle('set',handle);
    S.backup={on:true,name:handle.name||'backup.json',last:null,err:null};
    await mirrorBackup(true);
    save();render();announce(t('backup_on')+' '+S.backup.name);
  }catch(e){if(e&&e.name!=='AbortError')modal(t('backup_fail')+': '+esc(String(e.message||e)))}
}
async function clearBackup(){
  await idbBackupHandle('del');
  S.backup={on:false,name:'',last:null,err:null};
  save();render();announce(t('backup_off'));
}
async function mirrorBackup(force){
  if(!S.backup||!S.backup.on)return false;
  try{
    var handle=await idbBackupHandle('get');
    if(!handle){S.backup.err='no handle';return false}
    if(handle.queryPermission){
      var p=await handle.queryPermission({mode:'readwrite'});
      if(p!=='granted'){p=await handle.requestPermission({mode:'readwrite'});if(p!=='granted'){S.backup.err='permission';return false}}
    }
    var w=await handle.createWritable();
    var payload=typeof doExport==='function'?doExport():JSON.stringify({app:'verhaltens-tracker',state:S,backupAt:new Date().toISOString()});
    // doExport returns string - use export object
    await w.write(payload);
    await w.close();
    S.backup.last=new Date().toISOString();S.backup.err=null;
    return true;
  }catch(e){S.backup.err=String(e.message||e);return false}
}

async function safeSave(){
  var bytes=approxSize(),limit=SOFT_MB*1024*1024;
  if(bytes>limit){modal('<h2 style="color:var(--warn)"><span class=em>⚠</span> '+t("storagefull_t")+'</h2><p>'+t("storagefull")+'</p><p class="mut">'+(bytes/1048576).toFixed(1)+' / '+SOFT_MB+' MB</p>');return false}
  try{await idbSet(S);try{localStorage.setItem("vt1",JSON.stringify(S))}catch(e){try{localStorage.setItem("vt1-meta",JSON.stringify({idb:true,n:(S.events||[]).length,ts:Date.now()}))}catch(_e){}}try{if(S.backup&&S.backup.on){if(!S._bakT)S._bakT=setTimeout(function(){S._bakT=null;mirrorBackup()},4000)}}catch(_b){}return true}
  catch(e){try{localStorage.setItem("vt1",JSON.stringify(S));return true}catch(e2){modal('<h2 style="color:var(--warn)"><span class=em>⚠</span> '+t("storagefull_t")+'</h2><p>'+t("storagefull")+'</p>');return false}}
}
const save=function(){safeSave()};
async function loadFromIDB(){try{var x=await idbGet();if(x&&x.animals){S=Object.assign({},D,x);applyTheme();render();if(S.rem&&S.rem.on)startRem();if(S.locked)setLock(true)}}catch(e){}}
loadFromIDB();
S.custom=S.custom||[];S.meta=S.meta||{};S.geoOn=!!S.geoOn;S.trash=S.trash||[];S.use=S.use||{};S.backup=S.backup||{on:false};S.locked=!!S.locked;S.obs=S.obs||[];S.rules=S.rules||[];S.g=S.g||{mode:'herd',ch:'tb',sp:null,ex:[],day:'all',b:'lying'};S.sub=S.sub||'t';S.hid=S.hid||[];S.ul=S.ul||[];BE.push(...S.custom);
const t=k=>T[S.lang][k]||k,$=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const open=(a,b)=>S.events.find(e=>e.animal===a&&e.beh===b&&!e.end);
let lastFocus=null;
function trapFocus(e){
  if(e.key==="Escape"){closeModal();return}
  if(e.key!=="Tab")return;
  const f=[...$("#mb").querySelectorAll("button,input,select,textarea,a[href],[tabindex]:not([tabindex='-1'])")].filter(x=>!x.disabled&&x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function openModal(h){
  lastFocus=document.activeElement;
  if(h!=null)$("#mb").innerHTML=h+(String(h).includes('data-a="close"')||String(h).includes("data-a='close'")?"":`<p><button class="btn" data-a="close" style="width:100%">OK</button></p>`);
  $("#mo").style.display="flex";
  const box=$("#mb"),h2=box.querySelector("h2");if(h2&&!h2.id)h2.id="mb-h";
  const f=box.querySelector("button,input,select,a[href],[tabindex]");f&&f.focus();
  box.onkeydown=trapFocus;
}
function closeModal(){$("#mo").style.display="none";if(lastFocus)try{lastFocus.focus()}catch(e){}}
function modal(h){openModal(h)}
function help(k){if(k.startsWith("b:")){const b=BE.find(x=>x.id===k.slice(2));modal(`<h2>${esc(bl(b))}</h2><p class="mut">${t("ca")}: ${CAT[b.cat][S.lang==="de"?1:0]} · ${[...b.sp].map(c=>SP[c][S.lang==="de"?1:0]).join(", ")}</p><p><b>${t("ex")}:</b> ${esc(S.lang==="de"?b.xd:b.xe)}</p>`)}else modal(`<h2>${t("h_"+k+"_t")}</h2>`+t("h_"+k))}
function render(){
 $("#ti").textContent=t("ti");document.documentElement.lang=S.lang;const th=document.querySelector('[data-a="theme"]');th.setAttribute('aria-pressed',String(!!S.theme));th.textContent=S.theme==='night'?'☾':S.theme==='outdoor'?'☀︎':'◐';th.setAttribute('aria-label',S.theme==='night'?t('night'):S.theme==='outdoor'?t('outd'):t('theme_day'));th.title=th.getAttribute('aria-label');document.querySelector('[data-a="lang"]').textContent=S.lang==="de"?"EN":"DE";
 const sk=document.getElementById("skip");if(sk)sk.textContent=S.lang==="de"?"Zum Inhalt springen":"Skip to content";

function eventGrid(events,animalId,t0,t1,stepMs){
  const n=Math.max(0,Math.floor((t1-t0)/stepMs));
  const g=new Array(n).fill('');
  events.filter(e=>e.animal===animalId).forEach(e=>{
    const s=Math.max(t0,new Date(e.start).getTime());
    const en=Math.min(t1,new Date(e.end||t1).getTime());
    if(en<=s)return;
    const i0=Math.floor((s-t0)/stepMs),i1=Math.ceil((en-t0)/stepMs);

function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},450)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function startRem(){clearInterval(iv);if(!S.rem.on){nextAt=0;return}nextAt=Date.now()+ms();try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wl=w).catch(()=>{})}catch(e){}
 iv=setInterval(()=>{if(Date.now()>=nextAt){nextAt=Date.now()+ms();beep();$("#mb").innerHTML=`<h2><span class=em>⏰</span> ${t("rt")}</h2><p>${t("rtx")}</p><div class="row"><button class="btn" data-a="snapok">${t("ok")}</button><button class="btn" data-a="hscan">${t("hscan")}</button><button class="btn s" data-a="close">${t("later")}</button></div>`;$("#mo").style.display="flex"}},500)}
function icsExport(){
  const rem=S.rem||{},val=Math.max(1,+rem.val||5),unit=rem.unit||'m';
  const ms=unit==='h'?val*3600000:val*60000;
  const pad=n=>String(n).padStart(2,'0');
  const fmt=d=>{const x=new Date(d);return x.getUTCFullYear()+pad(x.getUTCMonth()+1)+pad(x.getUTCDate())+'T'+pad(x.getUTCHours())+pad(x.getUTCMinutes())+pad(x.getUTCSeconds())+'Z'};
  let t=Date.now(),out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Verhaltens-Tracker//EN\r\n';
  for(let i=0;i<24;i++){
    t+=ms;
    out+='BEGIN:VEVENT\r\nUID:vt-rem-'+i+'-'+t+'@local\r\nDTSTAMP:'+fmt(Date.now())+'\r\nDTSTART:'+fmt(t)+'\r\nSUMMARY:'+(S.lang==='de'?'Verhaltens-Erinnerung':'Behaviour reminder')+'\r\nDESCRIPTION:Scan/observation interval '+val+(unit==='h'?'h':'min')+'\r\nEND:VEVENT\r\n';
  }
  out+='END:VCALENDAR\r\n';
  return out;
}


function printReport(){
  const rows=S.events.slice().sort((a,b)=>a.start<b.start?-1:1).slice(0,200).map(e=>{
    const a=S.animals.find(x=>x.id===e.animal),b=e.beh==='__nv__'?{en:'Out of sight',de:'Ausser Sicht'}:BE.find(x=>x.id===e.beh);
    return '<tr><td>'+esc(e.start)+'</td><td>'+esc(a?lab(a):e.animal)+'</td><td>'+esc(b?(S.lang==='de'?b.de:b.en):e.beh)+'</td><td>'+(e.end?esc(e.end):'…')+'</td><td>'+esc(e.note||'')+'</td></tr>';
  }).join('');
  const w=window.open('','_blank');
  if(!w){modal(t('print_block'));return}
  w.document.write('<!doctype html><html><head><title>VT Report</title><style>body{font:12pt/1.4 system-ui,sans-serif;margin:1.5cm;color:#111}h1{font-size:16pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:.25rem .4rem;text-align:left}th{background:#eee}@media print{body{margin:1cm}}</style><\/head><body>');
  w.document.write('<h1>Verhaltens-Tracker / Behaviour Report</h1>');
  w.document.write('<p>'+esc(JSON.stringify(S.meta||{}))+'</p>');
  w.document.write('<p>Animals: '+S.animals.length+' · Events: '+S.events.length+' · '+new Date().toISOString()+'</p>');
  w.document.write('<table><thead><tr><th>Start</th><th>Animal</th><th>Behavior</th><th>End</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table>');
  w.document.write('<\/body><\/html>');
  w.document.close();
  setTimeout(function(){w.print()},300);
}

function doExport(){const o={app:"verhaltens-tracker",version:1,session:S.meta,observations:S.obs,exportedAt:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,animals:S.animals.map(a=>({id:a.id,name:a.name||null,number:a.num||null,species:SP[a.sp][0],demo:a.demo||undefined})),events:S.events.map(e=>({animalId:e.animal,behavior:e.beh,session:e.m||null,start:e.start,end:e.end,durationSec:e.end?Math.round((new Date(e.end)-new Date(e.start))/1000):null,note:e.note||null,geo:e.geo||null,hasPhoto:!!e.photo,hist:e.hist||[],edited:!!(e.hist&&e.hist.some(h=>h.a==="edit"||h.a==="photo"||h.a==="geo"))})),snapshots:S.scans.map(s=>({time:s.ts,animalId:s.animal,activeBehaviors:s.beh,source:s.src||'reminder',scanId:s.scan||null,scanStart:s.t0||null})),behaviors:Object.fromEntries(BE.map(b=>[b.id,{en:b.en,de:b.de,mainCategory:CAT[b.cat][0],species:[...b.sp].map(c=>SP[c][0]),definitionEn:b.xe,definitionDe:b.xd,custom:b.id.startsWith('c_')}])),reminder:{every:S.rem.val,unit:S.rem.unit==="m"?"minutes":"seconds"}};return JSON.stringify(o,null,2)}
async function act(a,v){
 if(a==="close"){qrStop();closeModal()}
 else if(a==="lang"){S.lang=S.lang==="de"?"en":"de";save();render()}
 else if(a==="view"){S.view=v;save();render();window.scrollTo(0,0)}
 else if(a==="cur"){S.cur=v;save();render()}
 else if(a==="sz"){S.sz=v;save();render()}
 else if(a==="res"){S.res=v;save();render()}
 else if(a==='undo'){const u=(S.ul||[]).pop();if(u){const e=S.events.find(x=>x.id===u[0]);if(e){if(u[1]==='s')S.events=S.events.filter(x=>x!==e);else e.end=null;save();if(e.animal===S.cur)tick();else{S.cur=e.animal;render()}}}}
 else if(a==='ed'){editEv(v)}
 else if(a==='ethx')outFile('ethogramm.json',ethExport())
 else if(a==='codebook')outFile('codebook.json',codebookExport())
 else if(a==='print')printReport()
 else if(a==='ics')outFile('vt-reminders.ics',icsExport(),'text/calendar')
 else if(a==='gear'){S.gearOpen=!S.gearOpen;render()}
 else if(a==='bakset')pickBackupFile()
 else if(a==='bakclr')clearBackup()
 else if(a==='baknow'){mirrorBackup(true).then(function(ok){announce(ok?t('backup_ok'):t('backup_fail'));render()})}
 else if(a==='ethi')$('#ei').click()
 else if(a==='mode'){S.mode=v;save();render()}
 else if(a==='hstart'||a==='hscan'){if(!S.animals.length)return;closeModal();S.herd={id:uid(),start:new Date().toISOString(),rec:{},sel:[],cur:S.animals[0].id};S.view='O';S.mode='herd';save();render();window.scrollTo(0,0)}
 else if(a==='hcur'){S.herd.cur=v;S.herd.sel=(S.herd.rec[v]||[]).slice();render()}
 else if(a==='hok'){const H=S.herd;if(!H.sel.length){$('#hm').textContent=t('hneed');return}S.scans=S.scans.filter(s=>!(s.scan===H.id&&s.animal===H.cur));S.scans.push({id:uid(),ts:new Date().toISOString(),animal:H.cur,beh:H.sel.slice(),src:'herd',scan:H.id,t0:H.start});H.rec[H.cur]=H.sel.slice();hnext()}
 else if(a==='hskip'){const H=S.herd;S.scans=S.scans.filter(s=>!(s.scan===H.id&&s.animal===H.cur));H.rec[H.cur]=[];hnext()}
 else if(a==='hend'){S.herd=null;save();render()}
 else if(a==='vrun'){if(S.run){const o=S.run,a0=new Date(o.start).getTime(),a1=Date.now(),inw=x=>{const k=new Date(x).getTime();return k>=a0&&k<=a1};o.end=new Date().toISOString();o.nev=S.events.filter(e=>inw(e.start)).length;o.taps=o.nev+S.events.filter(e=>e.end&&inw(e.end)).length+S.scans.filter(s=>inw(s.ts)).length;S.obs.push(o);S.run=null;save();render()}else{S.run={id:uid(),start:new Date().toISOString(),label:($('#vl')||{}).value||'',vmin:+(($('#vm')||{}).value)||0};S.view='O';save();render();window.scrollTo(0,0)}}
 else if(a==='vb'||a==='vg'){const o=S.obs.find(x=>x.id===v);if(o)outFile((a==='vb'?'boris-vergleich-':'raster-')+(o.label||o.id).replace(/[^\w-]/g,'_')+'.csv',a==='vb'?csvB(o):csvG(o))}
 else if(a==='vdel'){S.obs=S.obs.filter(x=>x.id!==v);save();render()}
 else if(a==='qr'){qrScan(k=>{const an=findAn(k);if(!an){modal(t('qrno')+': <b>'+esc(k)+'</b>');return}if(S.mode==='herd'&&S.herd){S.herd.cur=an.id;S.herd.sel=(S.herd.rec[an.id]||[]).slice()}else S.cur=an.id;save();render()})}
 else if(a==='qra'){qrScan(k=>{if(findAn(k)){modal(t('qrex')+': <b>'+esc(k)+'</b>');return}$('#anu').value=k.slice(0,20);$('#anu').focus()})}
 else if(a==='wp'){const p=WP.find(x=>x.id===v);S.hid=p.show?BE.filter(b=>!b.id.startsWith('c_')&&!p.show.includes(b.id)).map(b=>b.id):[];if(p.rules)S.rules=p.rules.map(x=>({beh:x[0],m:x[1],thr:null}));save();render()}
 else if(a==='radd'){S.rules.push({beh:$('#rb').value,m:$('#rm').value,thr:null});save();render()}
 else if(a==='rdel'){S.rules.splice(+v,1);save();render()}
 else if(a==='mgf')$('#mi').click()
 else if(a==='mgclip'){try{navigator.clipboard.readText().then(mergeText).catch(()=>modal(t('imp_bad')))}catch(e){modal(t('imp_bad'))}}
 else if(a==='mgok'){mergeApply();closeModal()}
 else if(a==='sub'){S.sub=v;save();render()}
 else if(a==='gch'){S.g.ch=v;save();render()}
 else if(a==='gmode'){S.g.mode=v;save();render()}
 else if(a==='gsp'){S.g.sp=v;save();render()}
 else if(a==='gex'){const i=S.g.ex.indexOf(v);if(i<0)S.g.ex.push(v);else S.g.ex.splice(i,1);save();render()}
 else if(a==='demo')demoLoad()
 else if(a==='demodel')demoDel()
 else if(a==='hma'){const H=S.heat,i=H.animals.indexOf(v);if(i<0)H.animals.push(v);else if(H.animals.length>1)H.animals.splice(i,1);save();render()}
 else if(a==='hmpng'){if(window.Plotly&&document.getElementById('hmPlot'))Plotly.downloadImage(document.getElementById('hmPlot'),{format:'png',filename:'heatmap-'+new Date().toISOString().slice(0,10),scale:2})}
 else if(a==='hmcsv')hmExportCSV()
 else if(a==='hmjson')hmExportJSON()
 else if(a==='hmcellcsv')hmExportCellCSV()
 else if(a==='hmbeamer'){const b=await hmExportBeamerZip();if(b)await outFile('beamer-export.zip',b,'application/zip')}
 else if(a==='hmretry')hmLoad()
 else if(a==='theme'){const order=['','outdoor','night'];const i=order.indexOf(S.theme||'');S.theme=order[(i<0?0:i+1)%order.length]||'';applyTheme();save();render();const lab=S.theme==='night'?t('night'):S.theme==='outdoor'?t('outd'):t('theme_day');announce(lab)}
 else if(a==='lock'){setLock(true);announce(t('lock_t'))}
 else if(a==='geotog'){S.geoOn=!S.geoOn;if(S.geoOn)maybeGeo();save();render();announce(t('geo')+': '+(S.geoOn?t('astart'):t('aend')))}
 else if(a==='geofix'){geoOnce(function(g){var e=S.events.find(function(x){return x.id===v});if(!e)return;pushHist(e,'geo',e.geo||null);e.geo=g;save();editEv(v)})}

 else if(a==='prot')outFile('studienprotokoll-verhaltens-tracker.md',t('proto'))
 else if(a==='csv3')outFile('verhalten-scans-'+new Date().toISOString().slice(0,10)+'.csv',csv3())
 else if(a==='edel'){const e=S.events.find(x=>x.id===v);if(e){pushHist(e,'delete',{beh:e.beh,start:e.start,end:e.end});(S.trash=S.trash||[]).push(Object.assign({},e,{deletedAt:new Date().toISOString()}));if(S.trash.length>200)S.trash=S.trash.slice(-200)}S.events=S.events.filter(x=>x.id!==v);save();closeModal();render()}
 else if(a==='esave'){saveEvFromForm(v)}
 else if(a==='csv1')outFile('verhalten-ereignisse-'+new Date().toISOString().slice(0,10)+'.csv',csv1())
 else if(a==='csv2')outFile('verhalten-startstop-'+new Date().toISOString().slice(0,10)+'.csv',csv2())
 else if(a==='badd'){const n=$('#bn').value.trim(),sp=[...document.querySelectorAll('.bsp:checked')].map(x=>x.value).join(''),d=$('#bd').value.trim()||'–';if(!n||!sp){$('#be').textContent=t('bneed');return}const b={id:'c_'+uid(),cat:$('#bc').value,sp:sp,en:n,de:n,xe:d,xd:d};S.custom.push(b);BE.push(b);save();render()}
 else if(a==='bdel'){if(S.events.some(e=>e.beh===v)){alert(t('inuse'));return}S.custom=S.custom.filter(b=>b.id!==v);BE.splice(BE.findIndex(b=>b.id===v),1);S.hid=S.hid.filter(x=>x!==v);save();render()}
 else if(a==='hid'){const i=S.hid.indexOf(v);if(i<0)S.hid.push(v);else S.hid.splice(i,1);save();const el=document.querySelector(`[data-a='hid'][data-v='${v}']`),h=S.hid.includes(v);if(el){el.className='btn '+(h?'s':'');el.textContent=h?'○':'●'}}
 else if(a==="add"){const n=$("#an").value.trim(),u=$("#anu").value.trim();if(!n&&!u){$("#er").textContent=t("need");return}S.animals.push({id:uid(),name:n,num:u,sp:$("#asp").value});save();render()}
 else if(a==="del"){if(confirm(t("cdel"))){S.animals=S.animals.filter(x=>x.id!==v);S.events=S.events.filter(e=>e.animal!==v);S.scans=S.scans.filter(e=>e.animal!==v);save();render()}}
 else if(a==="rt"){S.rem.val=Math.max(1,+$("#rv").value||1);S.rem.unit=$("#ru").value;S.rem.on=!S.rem.on;save();startRem();render()}
 else if(a==="snap"||a==="snapok"){snap();closeModal();if(S.rem.on)nextAt=Date.now()+ms()}
 else if(a==="exp"){const j=await doExport();let ok=false;try{const d=await claude.use("downloads");if(d){await d.save({filename:"verhalten-"+new Date().toISOString().slice(0,10)+".json",data:j});ok=true;S.lastExp=Date.now();save();$("#ms").textContent=t("dl")}}catch(e){}if(!ok){const x=$("#ta");x.value=j;x.style.display="block";x.select()}}
 else if(a==="copy"){const j=await doExport(),x=$("#ta");x.value=j;x.style.display="block";x.select();try{await navigator.clipboard.writeText(j);$("#ms").textContent=t("cp")}catch(e){try{document.execCommand("copy");$("#ms").textContent=t("cp")}catch(e2){}}}
 else if(a==="clr"){if(confirm(t("cclr"))){S.animals=[];S.events=[];S.scans=[];S.cur=null;save();render()}}}
let thT=null,thSkip=false,thHintT=null;
function thBtn(){return document.querySelector('[data-a="theme"]')}
function thCancel(){if(thT){clearTimeout(thT);thT=null}const b=thBtn();if(b)b.classList.remove('hold')}
function thHint(){const m=t('theme_hold');announce(m);let h=document.getElementById('thh');if(!h){h=document.createElement('div');h.id='thh';h.className='thh';h.setAttribute('role','status');document.body.appendChild(h)}h.textContent=m;clearTimeout(thHintT);thHintT=setTimeout(()=>{h.remove()},2200)}
function thStart(){if(thT)return;const b=thBtn();if(b)b.classList.add('hold');try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}thT=setTimeout(()=>{thT=null;const b2=thBtn();if(b2)b2.classList.remove('hold');thSkip=true;setTimeout(()=>{thSkip=false},800);const h=document.getElementById('thh');if(h)h.remove();act('theme')},3000)}
document.addEventListener('pointerdown',e=>{if(S.theme==='night'&&e.target.closest&&e.target.closest('[data-a="theme"]'))thStart()});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{if(thT){thCancel();if(S.theme==='night')thHint()}}));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-a="theme"]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(S.theme==='night'&&(e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-a="theme"]')){e.preventDefault();if(!e.repeat)thStart()}});
document.addEventListener('keyup',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-a="theme"]')){if(thT){e.preventDefault();thCancel();thHint()}else if(S.theme==='night')e.preventDefault()}});
document.addEventListener("click",e=>{const q=e.target.closest("[data-h]");if(q){e.stopPropagation();help(q.dataset.h);return}
 if(e.target.id==="mo"){act("close");return}
 const hb=e.target.closest(".hb");if(hb){hsel(hb);return}
 const b=e.target.closest(".b");if(b){toggle(b.dataset.b);return}
 const x=e.target.closest("[data-a]");if(x&&x.dataset.a==="theme"&&(thSkip||S.theme==="night")){thSkip=false;return}if(x&&x.id!=="mo")act(x.dataset.a,x.dataset.v)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("b")){e.preventDefault();if(e.target.classList.contains("hb"))hsel(e.target);else toggle(e.target.dataset.b)}});
document.addEventListener('change',e=>{if(e.target.id==='dsel'){S.day=e.target.value;save();render()}});
setInterval(()=>{if(S.view==="O")tick()},1000);
applyTheme();render();if(S.rem.on)startRem();if(S.locked)setLock(true);
try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(function(){})}catch(e){}
